<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑猪游戏测试</title>
    <style>
        body{
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #222;
        color: #fff;
        font-family: sans-serif;
    }
    canvas{
        border: 2px solid #444;
        background-color: #111;
        border-radius: 8px;
    }
    #score{
        margin-top: 10px;
        font-size: 20px;
    }
    </style>
</head>
<body>
    <div score>得分: 0</div>
        <canvas id="game" width="400" height="600"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const W = canvas.width;
        const H = canvas.height;
        const player = { x: W / 2 -20, y: H -60, width: 40, height: 40, speed: 6 };
        const key={}
        document.addEventListener('keydown', e => key[e.key] = true);
        document.addEventListener('keyup', e => key[e.key] = false);
        let obstacles = [];
        let score = 0;
        let gameOver = false;
        let frame=0;
        function spanObstacle(){
            const size=20+Math.random()*40;
            obstacles.push({
                x: Math.random() * (W - size),
                y: -size,
                width: size,
                height: size,
                speed: 2 + Math.random() * 3+score*0.02
            })
        }
        function update(){
            if(gameOver) return;
            frame++;
            if(frame%40===0) spanObstacle();
            if(key['ArrowLeft'] && player.x > 0) player.x -= player.speed;
            if(key['ArrowRight'] && player.x + player.width < W) player.x += player.speed;
            obstacles.forEach(ob => {
                ob.y += ob.speed;
                if(ob.y > H){
                    score++;
                    scoreElement.textContent = '得分: ' + score;
                }
                if(player.x < ob.x + ob.width &&
                   player.x + player.width > ob.x &&
                   player.y < ob.y + ob.height &&
                   player.y + player.height > ob.y){
                    gameOver = true;
                    alert('游戏结束! 得分: ' + score);
                }
            });
            obstacles = obstacles.filter(ob => ob.y <= H);
        }
        function draw(){
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = 'cyan';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = 'red';
            obstacles.forEach(ob => {
                ctx.fillRect(ob.x, ob.y, ob.width, ob.height);
            });
        }
        document.addEventListener('keydown', e => {
            if(e.key === 'r' && gameOver){
                gameOver = false;
                score = 0;
                scoreElement.textContent = '得分: ' + score;
                obstacles = [];
                player.x = W / 2 -20;
                player.y = H -60;
            }
        });
        function gameLoop(){
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
